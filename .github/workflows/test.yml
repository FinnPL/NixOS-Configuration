name: "Test NixOS Configuration"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  basic-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [centaur, orthrus]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    - name: Prepare /usr/share/wallpaper and update flake.lock
      run: ./.github/scripts/prepare-wallpapers.sh

    - name: Check flake syntax
      run: nix flake check --verbose

    - name: Evaluate NixOS configuration for ${{ matrix.host }}
      run: |
        nix eval .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath \
          --verbose

    - name: Check for common issues
      run: |
        echo "Checking for common configuration issues..."
        
        # Check if all imports exist
        echo "Verifying all imports are accessible..."
        nix eval .#nixosConfigurations.${{ matrix.host }}.options --apply 'x: "imports-ok"' || echo "Import check failed"
        
        # Check if home-manager is properly configured
        echo "Checking home-manager integration..."
        nix eval .#nixosConfigurations.${{ matrix.host }}.config.home-manager --apply 'x: "hm-ok"' || echo "Home-manager not configured"
        
        echo "Basic checks completed!"

  dry-build:
    runs-on: ubuntu-latest
    needs: basic-check
    strategy:
      matrix:
        host: [centaur, orthrus]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    - name: Prepare /usr/share/wallpaper and update flake.lock
      run: ./.github/scripts/prepare-wallpapers.sh

    - name: Dry build NixOS configuration for ${{ matrix.host }}
      run: |
        nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel \
          --dry-run \
          --verbose
